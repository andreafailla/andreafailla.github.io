[project]
name = "andreafailla-site"
version = "1.0.0"
description = "Static personal website built with a small Python script."
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
