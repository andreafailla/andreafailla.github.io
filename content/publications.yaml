- id: failla2022attributed
  title: 'Attributed Stream-Hypernetwork Analysis: a SocioPatterns Case Study'
  authors:
  - Andrea Failla
  - Salvatore Citraro
  - Giulio Rossetti
  year: 2022
  type: inproceedings
  venue: Italian Symposium on Advanced Database Systems (SEBD 2022)
  pages: 383--391
  topics:
  - higher-order
  - temporal
  abstract: >-
    Network science comes as a solid framework to describe a multitude of human behaviours. Face-to-face
    human interactions, for instance, are often represented by dynamic networks involving time-varying
    links. Such temporal models are shown to be effective as proxies for real communications between individuals.
    However, networks are intrinsically bounded to pairwise/dyadic connections, whereas complex human
    dynamics can naturally involve higher-order organization, namely relationships between groups of entities.
    In the last few years, hypergraph and simplicial complex models have been addressed as promising tools
    to better understand the dynamics of social groups. In the analysis of face-to-face interactions,
    the higher-order organization of temporal networks has been addressed by investigating collections
    of datasets initially designed for graph-based analysis. Yet even these higher-order representations
    continue to ignore the rich attributes or metadata often carried by the nodes. Such attributes can
    offer new interesting perspectives about the dynamics of the higher-order structure emerging from
    a stream of social interactions. In this work, we aim to address this gap by introducing attributed
    stream-hypernetwork models, i.e., higher-order temporal networks with attributive information on nodes.
    Considering the Primary and High School temporal networks from the well-known SocioPatterns project,
    we infer the higher-order temporal structure of interactions between children and high school students,
    and we characterize their non-trivial relationships with respect to their gender attribute.

- id: failla2022attributedb
  title: >-
    Attributed Stream-Hypernetwork Analysis: Homophilic Behaviors in Pairwise and Group Political Discussions
    on Reddit
  authors:
  - Andrea Failla
  - Salvatore Citraro
  - Giulio Rossetti
  year: 2022
  date: '2023-01-04'
  type: inproceedings
  venue: International Conference on Complex Networks and Their Applications (CNA 2022)
  pages: 150--161
  publisher: Springer
  doi: 10.1007/978-3-031-21127-0_13
  topics:
  - higher-order
  - mixing
  - platforms
  links:
    slides: /uploads/slides/ASH_CN.pdf
  abstract: >-
    Complex networks are solid models to describe human behavior. However, most analyses employing them
    are bounded to observations made on dyadic connectivity, whereas complex human dynamics involve higher-order
    relations as well. In the last few years, hypergraph models are rising as promising tools to better
    understand the behavior of social groups. Yet even such higher-order representations ignore the importance
    of the rich attributes carried by the nodes. In this work we introduce ASH, an Attributed Stream-Hypernetwork
    framework to model higher-order temporal networks with attributes on nodes. We leverage ASH to study
    pairwise and group political discussions on the well-known Reddit platform. Our analysis unveils different
    patterns while looking at either a pairwise or a higher-order structure for the same phenomena. In
    particular, we find out that Reddit users tend to surround themselves by like e-minded peers with
    respect to their political leaning when online discussions are proxied by pairwise interactions; conversely,
    such a tendency significantly decreases when considering nodes embedded in higher-order contexts -
    that often describe heterophilic discussions.

