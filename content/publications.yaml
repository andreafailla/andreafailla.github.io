- id: failla2024m
  title: '“I’m in the Bluesky Tonight”: Insights from a Year Worth of Social Data'
  authors:
  - Andrea Failla
  - Giulio Rossetti
  year: 2024
  date: '2024-11-05'
  type: article
  venue: PLOS ONE
  volume: '19'
  number: '11'
  pages: e0310330
  publisher: Public Library of Science
  doi: 10.1371/journal.pone.0310330
  topics:
  - platforms
  featured: true
  links:
    pdf: >-
      https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0310330&type=printable
    dataset: https://doi.org/10.5281/zenodo.11082878
  abstract: >-
    Pollution of online social spaces caused by rampaging d/misinformation is a growing societal concern.
    However, recent decisions to reduce access to social media APIs are causing a shortage of publicly
    available, recent, social media data, thus hindering the advancement of computational social science
    as a whole. We present a large, high-coverage dataset of social interactions and user-generated content
    from Bluesky Social to address this pressing issue. The dataset contains the complete post history
    of over 4M users (81% of all registered accounts), totalling 235M posts. We also make available social
    data covering follow, comment, repost, and quote interactions. Since Bluesky allows users to create
    and like feed generators (i.e., content recommendation algorithms), we also release the full output
    of several popular algorithms available on the platform, along with their timestamped “like” interactions.
    This dataset allows novel analysis of online behavior and human-machine engagement patterns. Notably,
    it provides ground-truth data for studying the effects of content exposure and self-selection and
    performing content virality and diffusion analysis.

- id: failla2023attributed
  title: >-
    Attributed Stream Hypergraphs: temporal modeling of node-attributed high-order interactions
  authors:
  - Andrea Failla
  - Salvatore Citraro
  - Giulio Rossetti
  year: 2023
  date: '2023-06-09'
  type: article
  venue: Applied Network Science
  volume: '8'
  number: '1'
  pages: '31'
  publisher: Springer
  doi: 10.1007/s41109-023-00555-6
  topics:
  - higher-order
  - temporal
  - mixing
  links:
    pdf: https://link.springer.com/content/pdf/10.1007/s41109-023-00555-6.pdf
    code: https://github.com/GiulioRossetti/ASH
  abstract: >-
    Recent advances in network science have resulted in two distinct research directions aimed at augmenting
    and enhancing representations for complex networks. The first direction, that of high-order modeling,
    aims to focus on connectivity between sets of nodes rather than pairs, whereas the second one, that
    of feature-rich augmentation, incorporates into a network all those elements that are driven by information
    which is external to the structure, like node properties or the flow of time. This paper proposes
    a novel toolbox, that of Attributed Stream Hypergraphs (ASHs), unifying both high-order and feature-rich
    elements for representing, mining, and analyzing complex networks. Applied to social network analysis,
    ASHs can characterize complex social phenomena along topological, dynamic and attributive elements.
    Experiments on real-world face-to-face and online social media interactions highlight that ASHs can
    easily allow for the analyses, among others, of high-order groups’ homophily, nodes’ homophily with
    respect to the hyperedges in which nodes participate, and time-respecting paths between hyperedges.

