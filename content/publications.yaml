- id: cau2026socialsim
  title: 'Social Simulations: from Agent-Based Modeling to Digital Twins'
  authors:
  - Erica Cau
  - Andrea Failla
  - Valentina Pansanella
  - Giulio Rossetti
  year: 2026
  date: '2026-07-15'
  type: preprint
  venue: arXiv
  arxiv: '2607.13693'
  topics:
  - llm
  note: >-
    Book chapter under review for the Encyclopedia of Social Network Analysis and Mining (3rd ed.)
  abstract: >-
    This book chapter covers the evolution of social simulation from classical agent-based models, in
    which agents interact according to explicitly defined behavioral rules, to AI-enhanced simulations
    based on Large Language Models and, ultimately, Social Digital Twins: high-fidelity, data-driven representations
    of real-world socio-technical systems. Along this trajectory, we discuss the main methodological foundations,
    applications, advantages, and limitations of each paradigm, highlighting the progressive shift from
    abstract models designed to investigate general social mechanisms toward increasingly realistic computational
    representations of specific social systems.

- id: cauteruccio2026structure
  title: Structure and dynamics of temporal hypergraphs via multi-rooted ego networks
  authors:
  - Francesco Cauteruccio
  - Salvatore Citraro
  - Andrea Failla
  - Giulio Rossetti
  year: 2026
  date: '2026-05-09'
  type: article
  venue: Social Network Analysis and Mining
  volume: '16'
  pages: '64'
  publisher: Springer
  doi: 10.1007/s13278-026-01603-6
  topics:
  - higher-order
  - temporal
  abstract: >-
    Ego-networks capture the local structure around a central entity. In this paper, we propose a framework
    that extends static pairwise settings to temporal hypergraphs and consists of two main components,
    namely, (i) the concept of Multi-Rooted Ego-Network (REN), which generalizes traditional ego-networks
    centered on a single node to potentially multiple nodes; and, (ii) similarity criteria for comparing
    consecutive RENs across time. The framework also enables the formalization of events such as , allowing
    the identification and categorization of persistent local structures. Through empirical evaluation
    on real-world temporal hypergraphs from the SocioPatterns database, we highlight the expressiveness
    of our approach in capturing and analyzing the evolution of localized group dynamics. Moreover, we
    focus on a case study involving diachronic word embeddings, highlighting correlations between statistical
    descriptors of RENs’ similarity time series and standard polysemy measures. This shows the flexibility
    of our framework across many application domains.

- id: failla2026starter
  title: Structure, Topics, and Diffusion Effects of Bluesky Starter Packs
  authors:
  - Andrea Failla
  - Vander Freitas
  - Giulio Rossetti
  - Carlos Ferreira
  year: 2026
  date: '2026-08-18'
  type: preprint
  venue: arXiv
  arxiv: '2608.17489'
  topics:
  - platforms
  abstract: >-
    User discovery is a central challenge in online social platforms, particularly during onboarding.
    Bluesky, a decentralized microblogging platform built on the AT Protocol, introduced starter packs:
    curated collections of accounts that users can follow in a single action to bootstrap their social
    network. In this paper, we present a large-scale empirical analysis of more than 50,000 English-language
    starter packs and over 600,000 associated users. We characterize their structural organization, topical
    composition, and impact on content diffusion. Our results show that starter packs form a highly interconnected
    ecosystem with substantial overlap across packs that largely reflects pre-existing communities. Topic
    modeling reveals a skewed landscape dominated by automatically generated personal packs alongside
    several thematic communities, which exhibit similar structural properties but markedly different adoption
    patterns. Finally, a matched event-study analysis shows that inclusion in a starter pack is strongly
    associated with a substantial increase in short-term repost activity.

- id: azevedo2026brazilian
  title: 'The Brazilian Vaccination Debate on YouTube: Topics, Perspectives, and Engagement Dynamics'
  authors:
  - Matheus S. Azevedo
  - Geovana S. de Oliveira
  - Andrea Failla
  - Alexandre M. de Sousa
  - Fabricio Murai
  - Ana Paula C. da Silva
  - Carlos H. G. Ferreira
  year: 2026
  date: '2026-08-18'
  type: preprint
  venue: arXiv
  arxiv: '2608.17502'
  topics:
  - platforms
  abstract: >-
    Vaccination debates are central to online public health communication, as COVID-19 intensified disputes
    over scientific authority, institutional trust, and political identity. Yet studies often isolate
    semantic structure, stance, misinformation, and engagement, leaving their interplay over time poorly
    understood. We conduct a multilevel computational text analysis based on language models applied to
    1.27 million Brazilian YouTube comments from 2018 to 2024, using what is, to our knowledge, the largest
    dataset of Brazilian vaccine discourse on the Web. We contrast producer framing in titles with audience
    discourse in comments, integrating Topic-derived themes with engagement metadata, conversational timing,
    stance-derived vaccine positions, and pre-pandemic, pandemic, and post-pandemic periods. Results show
    that COVID-19 dominates biomedical and informational themes in titles, whereas comments span personal
    health reports, vaccine effects, information credibility, conspiracy narratives, and political disputes.
    Health-related macro-topics dominate in scale and persistence, while conspiratorial and political
    themes are associated with faster interactions and a greater concentration of vaccine-opposing engagement.
    Post-pandemic activity remains centered on health experiences, vaccine effects, and information credibility,
    indicating no return to the pre-pandemic thematic configuration. By integrating semantic, interactional,
    stance, and temporal dimensions, this study shows how audiences reframe producer-framed health content
    and how vaccine controversies persist beyond the acute pandemic period.

- id: rossetti2024social
  title: 'YSocial: An artificial intelligence powered social media virtual twin'
  authors:
  - Giulio Rossetti
  - Massimo Stella
  - Rémy Cazabet
  - Katherine Abramski
  - Salvatore Citraro
  - Erica Cau
  - Andrea Failla
  - Virginia Morini
  - Valentina Pansanella
  year: 2026
  date: '2026-07-18'
  type: article
  venue: Big Data & Society
  volume: '13'
  number: '3'
  pages: '20539517261431576'
  publisher: SAGE
  doi: 10.1177/20539517261431576
  arxiv: '2408.00818'
  topics:
  - llm
  - platforms
  featured: true
  award: Best Oral Presentation Award, CNA 2024 · Best Poster Award, ISTI Day 2025
  aliases:
  - 'Y Social: an LLM-powered Social Media Digital Twin'
  links:
    code: https://github.com/YSocialTwin
    project: https://y-not.social/
  abstract: >-
    This paper introduces YSocial, a new-generation virtual twin designed to replicate an online social
    media platform. Digital and virtual twins are virtual replicas of physical systems that allow for
    advanced analyses, control, experimentation, and scenario simulations. In the case of social media,
    a virtual twin such as YSocial provides a powerful tool for researchers to simulate and understand
    complex online interactions. YSocial leverages state-of-the-art large language models (LLMs) to replicate
    sophisticated agent behaviors, enabling accurate simulations of user interactions, content dissemination,
    and network dynamics. By integrating these aspects, YSocial offers valuable insights into user engagement,
    information spread, and the impact of platform policies. Moreover, integrating LLMs allows YSocial
    to generate nuanced textual content and predict user responses, facilitating the study of emergent
    phenomena in online environments. To better characterize YSocial, we describe the rationale behind
    its implementation, provide examples of the analyses that can be performed on the data it generates,
    and discuss its relevance for multidisciplinary research.

- id: failla2025characterizing
  title: Characterizing User Archetypes and Discussions on Social Hypernetworks
  authors:
  - Andrea Failla
  - Salvatore Citraro
  - Giulio Rossetti
  - Francesco Cauteruccio
  year: 2025
  date: '2025-09-16'
  type: article
  venue: Big Data and Cognitive Computing
  volume: '9'
  number: '9'
  pages: '236'
  publisher: MDPI
  doi: 10.3390/bdcc9090236
  arxiv: '2407.21753'
  topics:
  - higher-order
  - platforms
  aliases:
  - Characterizing User Archetypes and Discussions on Scored.co
  links:
    pdf: https://www.mdpi.com/2504-2289/9/9/236/pdf?version=1758015146
    dataset: https://doi.org/10.5281/zenodo.13142207
  abstract: >-
    In recent years, the proliferation of social platforms has drastically transformed how individuals
    interact, organize, and share information. In this scenario, there has been an unprecedented increase
    in the scale and complexity of interactions and, at the same time, little to no research about certain
    fringe social platforms. In this paper, we present a multi-dimensional framework for characterizing
    nodes and hyperedges in social hypernetworks, with a focus on the understudied alt-right platform
    Scored.co. Our approach integrates the possibility of studying higher-order interactions, thanks to
    the hypernetwork representation, and various node features such as user activity, sentiment, and toxicity,
    with the aim of defining distinct user archetypes and understanding their roles within the network.
    Utilizing a comprehensive dataset from Scored.co, consisting of more than 4.4 M posts and 36.9 M comments,
    we analyze the dynamics of these archetypes over time and explore their interactions and influence
    within the community. We identify eight archetypes, with the largest group comprising over 15,000
    users, and observe that 44% of interactions involve at least five participants, highlighting the importance
    of higher-order modeling. Furthermore, we find significant archetype transitions and stable yet locally
    dense interaction patterns, with users exposed to roughly 1000 unique peers on average. The framework’s
    versatility allows for detailed analysis of both individual user behaviors and broader social structures.
    Our findings highlight the importance of higher-order interactions and node features in understanding
    social dynamics, and offer new insights into the roles and behaviors that emerge in complex online
    environments.

