- id: cau2026collective
  title: Collective Opinion Dynamics in Structured LLM Populations
  authors:
  - Erica Cau
  - Andrea Failla
  - Giulio Rossetti
  year: 2026
  date: '2026-04-13'
  type: preprint
  venue: arXiv
  arxiv: '2604.11312'
  topics:
  - llm
  aliases:
  - Network effects and agreement drift in LLM debates
  abstract: >-
    Large Language Models are increasingly deployed as interacting agents in settings such as online platforms,
    recommendation systems, and multi-agent applications. Understanding the collective behaviors that
    emerge from their interactions is therefore increasingly crucial, especially as these behaviors may
    shape public opinion and contribute to polarization. In this work, we investigate how network structure
    and group composition shape the evolution of opinions in populations of LLM agents engaged in multi-round
    debates. We generate networks with controlled levels of homophily and varying group sizes, and perform
    ten independent runs per configuration. The results show that LLM agents exhibit patterns that are
    highly sensitive to network structure, relative group sizes, and to the model itself. We highlight
    that even within LLM populations, low homophily facilitates convergence by increasing opportunities
    for cross-group interaction, whereas higher homophily limits cross-group exposure and can preserve
    distinct opinion states, consistent with previous research. We further show that the choice of LLM
    substantially affects the resulting dynamics, with different models exhibiting different patterns
    of opinion updating under comparable network conditions. At the individual level, providing agents
    with information about their local neighborhood further modulates opinion transitions, revealing substantial
    differences between models in their sensitivity to local social context. Overall, our findings show
    that the collective dynamics of LLM populations arise from interactions among model-specific behavior,
    network structure, population composition, and local social information.

- id: mesina2026lowvocality
  title: Low-vocality Engagement and Participation Dynamics on Bluesky
  authors:
  - Veronica Mesina
  - Andrea Failla
  - Luca Pappalardo
  - Giulio Rossetti
  year: 2026
  date: '2026-06-19'
  type: preprint
  venue: arXiv
  arxiv: '2606.21665'
  topics:
  - platforms
  aliases:
  - Low-vocality engagement shapes online participation
  abstract: >-
    Online participation is often measured through visible expression, especially posting, yet many consequential
    forms of engagement occur through less vocal actions such as liking and following. Here we study how
    users inhabit Bluesky by reconstructing participation profiles from more than three billion activity
    records produced by a near-complete sample accounting for more than 80\% of registered users. We aggregate
    behavior into monthly user-level observations and distinguish two dimensions that are often conflated
    in platform analytics: intensity, capturing how much users engage, and style, capturing how engagement
    is expressed across actions. We find that vocal production is highly concentrated, but low-posting
    behavior does not imply absence from platform participation. High-intensity engagement is most strongly
    associated with liking rather than posting, while posting-oriented participation is more common among
    low-intensity users, indicating that visibility and sustained engagement should not be conflated.
    Transition patterns suggest that high-intensity likers and posters could be described as attractors;
    network-building redirects users within the active space; whereas observed inactivity acts as a persistent
    boundary that selectively limits re-entry. Higher-order motifs further show that inactivity often
    interrupts rather than erases prior regimes, and that low-intensity liking can precede durable high-intensity
    engagement. These results show that online participation is structured by differentiated low-vocality
    practices, calling for a shift from post-centered measures of activity toward dynamic accounts of
    platform presence. We identify a broader challenge for computational social science: platform participation
    cannot be adequately understood through the behavior of vocal minorities alone.

