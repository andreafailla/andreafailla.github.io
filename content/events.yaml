- date: 2024-07-10
  role: Invited talk
  title: "Group Dynamics in Online Social Networks: Communities and High-order Interactions in Time"
  venue: Colorful Seminars Series (SoBigData), University of Pisa, Italy
  url: http://www.sobigdata.eu/events/colorful-seminar-series-news-and-emotions-5deg-seminar
  abstract: >-
    Pollution of online social spaces caused by rampaging d/misinformation is a growing societal concern.
    To tackle these issues, it is crucial to describe and understand group behaviors on online social
    platforms. In this presentation, we will go through novel methods and techniques to study groups and
    their temporal evolution, with applications to debates on social media. We will focus on hypergraphs —
    models that can encode larger-than-binary interactions — and graph communities — clusters extracted
    from network data — and highlight the nuances these structures bring to research on digital social
    dynamics.
  links:
    - label: Slides
      url: /uploads/slides/colorful-seminars.pdf

